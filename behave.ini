[behave]
# skips scenarios tagged @ignore, so a contributor can park one without deleting it
tags = not @ignore
# shows stdout/stderr during test execution, not only on failure
capture_stdout = false
capture_stderr = false

[behave.userdata]
# logging of the hooks, runner, and docker image builds; DEBUG also prints the
# output of each blackvuesync run
log_level = INFO
# mock dashcam http request logging (flask werkzeug; direct mode only)
log_level_http = WARN
# mock dashcam logging (direct mode only): INFO shows the configured errors
# it answers, DEBUG also the requests for unlisted files
log_level_mock_dashcam = INFO
# collects code coverage data (direct mode only)
collect_coverage = false
# runs the suite against the legacy camera protocol instead of V1.009+;
# scenarios tagged @use.with_protocol=legacy only run when this is true
legacy_api = false
# execution implementation: direct (subprocess) or docker (container);
# active tags such as @use.with_implementation=direct select scenarios by it
implementation = direct
# blackvuesync image to test in docker mode; builds one when unset
# image_name = acolomba/blackvuesync:test
