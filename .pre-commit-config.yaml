# agent tooling rewrites these directories; the hooks under .claude/hooks/ stay
# checked
exclude: ^(\.agents/|\.claude/(?!hooks/)|\.codex/|\.pi/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # file quality & formatting
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: ['--fix=lf']
        files: '(\.sh|blackvuesync\.py|crontab)$'
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

      # security
      - id: detect-private-key
      - id: check-added-large-files
        args: ['--maxkb=16']
        exclude: '^features/mock_dashcam/files/|\.md$'

      # syntax checkers
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-ast

      # python-specific
      - id: debug-statements
      - id: check-builtin-literals
      # test/ holds test modules and conftest.py files only
      - id: name-tests-test
        args: ['--pytest']
        files: '^test/.+\.py$'

      # file organization
      - id: file-contents-sorter
      - id: pretty-format-json
        args: ['--autofix', '--indent=4']
        # other tools write these files
        exclude: '^(\.sonarlint/)'
      - id: requirements-txt-fixer
      - id: sort-simple-yaml

      # repository structure
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules
      - id: no-commit-to-branch
        args: ['--branch', 'main', '--pattern', 'releases/.*']

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: ['pytest']

  - repo: https://github.com/pycqa/pylint
    rev: v3.3.9
    hooks:
      - id: pylint
        files: ^blackvuesync\.py$

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
      - id: fix-ligatures
      - id: forbid-bidi-controls

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.92.4
    hooks:
      - id: trufflehog

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}']
        exclude: ^\.copier-answers\.yml$

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        exclude: ^\.copier-answers\.yml$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-footnote
        exclude: ^\.github/ISSUE_TEMPLATE/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^\.github/ISSUE_TEMPLATE/

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # --no-progress is repeated here. Setting args replaces the upstream list
        # instead of adding to it.
        args: ["--no-progress", "--config", "zizmor.yml"]

  - repo: local
    hooks:
      # fails when a source module has no paired test module, or the reverse
      - id: check-corresponding-tests
        name: check corresponding tests
        entry: python3 scripts/check_corresponding_tests.py
        language: system
        pass_filenames: false
        files: '^(blackvuesync\.py|test/.*\.py)$'
