name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sonarcloud:
    # secrets are unavailable to Dependabot and fork-originated PRs.
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests with coverage
        run: |
          COVERAGE_FILE=.coverage.pytest pytest test/blackvuesync_test.py --cov=blackvuesync --cov-report= -v

      - name: Run integration tests with coverage (V1.009+ protocol)
        run: |
          behave --no-capture --format progress -D collect_coverage=true

      - name: Run integration tests with coverage (legacy protocol)
        run: |
          behave --no-capture --format progress -D collect_coverage=true -D legacy_api=true

      - name: Combine coverage data
        run: |
          coverage combine --keep
          coverage xml -o coverage.xml
          coverage report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          # push and pull_request already carry branch/PR context in the event, and
          # naming a branch on a pull_request breaks PR decoration. workflow_dispatch
          # carries no such context, so without this the run is recorded against the
          # project's main branch.
          args: ${{ github.event_name == 'workflow_dispatch' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
