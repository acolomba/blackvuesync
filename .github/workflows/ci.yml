name: CI

on:
  # publish.yml calls this workflow on v* tags, so a release always runs the
  # full gate before publishing.
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: scripts/check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run the merge gate
        run: scripts/check.sh

  build:
    name: build and audit the package
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build the package
        run: uv build

      - name: Extract the built artifacts
        run: |
          mkdir -p /tmp/package
          tar -xzf dist/*.tar.gz -C /tmp/package
          unzip -q dist/*.whl -d /tmp/package/wheel

      - name: Install trufflehog
        # pinned to the revision .pre-commit-config.yaml pins for the trufflehog
        # hook, so both scans run identical code.
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/v3.92.4/scripts/install.sh | sh -s -- -b /usr/local/bin v3.92.4

      - name: Scan the built artifacts for secrets
        run: trufflehog filesystem /tmp/package --results=verified,unknown --fail

      - name: Upload the built artifacts
        # publish.yml publishes these files, so a release ships what this run built
        # and scanned.
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1
